name: 部署 Hugo 站点到 GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 内容与模板校验
        run: npm test

  build:
    needs: verify
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.160.1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.160.1"
          extended: true

      - name: 构建站点
        # 仓库变量 HUGO_BASE_URL 必须填写，例如 https://<user>.github.io/<repo>/
        # hugo.yaml 里留的是 "/"（Qoder Sites 产物契约），拿它构建 Pages 子路径会导致全站链接失效
        env:
          HUGO_BASE_URL: ${{ vars.HUGO_BASE_URL }}
        run: |
          if [ -z "$HUGO_BASE_URL" ]; then
            echo "::error::未设置仓库变量 HUGO_BASE_URL：Settings → Secrets and variables → Actions → Variables"
            exit 1
          fi
          hugo --gc --minify --baseURL "$HUGO_BASE_URL"

      - name: 检查产物
        run: |
          test -f public/index.html
          test -f public/library/index.html
          test -f public/search/index.html
          test -f public/archives/index.html
          test -f public/tags/index.html
          test -f public/entities/index.html
          test -f public/index.json
          echo "产物页面数：$(find public -name index.html | wc -l)"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 隐私门禁（公开产物不得含个人信息）
        run: node scripts/verify-privacy.mjs public

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
